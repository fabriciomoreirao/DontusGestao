name: Deploy web and API to Amazon ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecs-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
  ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  WEB_CONTAINER_NAME: ${{ vars.WEB_CONTAINER_NAME || 'web' }}
  API_CONTAINER_NAME: ${{ vars.API_CONTAINER_NAME || 'api' }}
  APP_ALLOWED_ORIGINS: ${{ vars.APP_ALLOWED_ORIGINS }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: AWS ECS
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_ARN ECR_WEB_REPOSITORY ECR_API_REPOSITORY ECS_CLUSTER ECS_SERVICE APP_ALLOWED_ORIGINS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure GitHub variable $name in the production environment."
              exit 1
            fi
          done
          if [[ "$WEB_CONTAINER_NAME" == "$API_CONTAINER_NAME" ]]; then
            echo '::error::Web and API must have different container names.'
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read task definition currently used by the service
        shell: bash
        run: |
          set -euo pipefail
          task_arn=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          test -n "$task_arn" && test "$task_arn" != None
          aws ecs describe-task-definition --task-definition "$task_arn" --query taskDefinition > task-definition.json
          jq -e --arg web "$WEB_CONTAINER_NAME" --arg api "$API_CONTAINER_NAME" '
            .runtimePlatform.cpuArchitecture != "ARM64" and
            any(.containerDefinitions[]; .name == $web) and
            any(.containerDefinitions[]; .name == $api)
          ' task-definition.json > /dev/null

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push both images
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          web_image="$REGISTRY/$ECR_WEB_REPOSITORY:$IMAGE_TAG"
          api_image="$REGISTRY/$ECR_API_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/amd64 --build-arg "APP_ALLOWED_ORIGINS=$APP_ALLOWED_ORIGINS" -t "$web_image" .
          docker build --platform linux/amd64 -t "$api_image" ./backend
          docker push "$web_image"
          docker push "$api_image"
          echo "web=$web_image" >> "$GITHUB_OUTPUT"
          echo "api=$api_image" >> "$GITHUB_OUTPUT"

      - name: Update web image
        id: web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.WEB_CONTAINER_NAME }}
          image: ${{ steps.images.outputs.web }}

      - name: Update API image
        id: api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.web.outputs.task-definition }}
          container-name: ${{ env.API_CONTAINER_NAME }}
          image: ${{ steps.images.outputs.api }}

      - name: Deploy and wait for service stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
